<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="1200" height="750" font-family="Arial, sans-serif">
  <style>
    .grid-line { stroke: #e0e0e0; stroke-width: 1; }
    .year-label { font-size: 12px; fill: #666; text-anchor: middle; }
    .row-bg { fill: #f9f9f9; }
    .row-bg:nth-child(even) { fill: #ffffff; }
    .bar-label { font-size: 11px; fill: white; text-anchor: middle; dominant-baseline: middle; pointer-events: none; text-shadow: 0px 0px 2px rgba(0,0,0,0.5); }
    .name-label { font-size: 14px; fill: #333; dominant-baseline: middle; font-weight: bold; }
    .legend-item { font-size: 12px; fill: #333; dominant-baseline: middle; }
    .title { font-size: 24px; font-weight: bold; fill: #333; text-anchor: middle; }
    
    /* Role Colors */
    .role-Diktátor { fill: #e74c3c; } /* Red */
    .role-Kancellár { fill: #9b59b6; } /* Purple */
    .role-Konzul { fill: #2ecc71; } /* Green */
    .role-Kormányzó { fill: #1abc9c; } /* Teal */
    .role-Nemzeti-Bank-elnök { fill: #f39c12; } /* Orange */
    .role-Szenátor { fill: #3498db; } /* Blue */
    .role-Titkosszolgálat-igazgató { fill: #34495e; } /* Dark Grey */
  </style>

  <rect width="100%" height="100%" fill="white" />

  <text x="600" y="40" class="title">Kormányzati Pozíciók Idővonala</text>

  <g transform="translate(150, 70)">
    <rect x="0" y="0" width="15" height="15" class="role-Szenátor" rx="3" />
    <text x="20" y="9" class="legend-item">Szenátor</text>
    
    <rect x="100" y="0" width="15" height="15" class="role-Diktátor" rx="3" />
    <text x="120" y="9" class="legend-item">Diktátor</text>
    
    <rect x="200" y="0" width="15" height="15" class="role-Kancellár" rx="3" />
    <text x="220" y="9" class="legend-item">Kancellár</text>
    
    <rect x="300" y="0" width="15" height="15" class="role-Konzul" rx="3" />
    <text x="320" y="9" class="legend-item">Konzul</text>
    
    <rect x="400" y="0" width="15" height="15" class="role-Nemzeti-Bank-elnök" rx="3" />
    <text x="420" y="9" class="legend-item">Nemzeti Bank elnök</text>
    
    <rect x="580" y="0" width="15" height="15" class="role-Kormányzó" rx="3" />
    <text x="600" y="9" class="legend-item">Kormányzó</text>
    
    <rect x="700" y="0" width="15" height="15" class="role-Titkosszolgálat-igazgató" rx="3" />
    <text x="720" y="9" class="legend-item">Titkosszolgálat igazgató</text>
  </g>

  <g transform="translate(200, 120)">
    
    <line x1="0" y1="0" x2="0" y2="580" class="grid-line" />
    <text x="0" y="-10" class="year-label">2000</text>
    
    <line x1="153" y1="0" x2="153" y2="580" class="grid-line" />
    <text x="153" y="-10" class="year-label">2005</text>
    
    <line x1="306" y1="0" x2="306" y2="580" class="grid-line" />
    <text x="306" y="-10" class="year-label">2010</text>
    
    <line x1="460" y1="0" x2="460" y2="580" class="grid-line" />
    <text x="460" y="-10" class="year-label">2015</text>
    
    <line x1="613" y1="0" x2="613" y2="580" class="grid-line" />
    <text x="613" y="-10" class="year-label">2020</text>
    
    <line x1="766" y1="0" x2="766" y2="580" class="grid-line" />
    <text x="766" y="-10" class="year-label">2025</text>
    
    <line x1="919" y1="0" x2="919" y2="580" class="grid-line" />
    <text x="919" y="-10" class="year-label">2030</text>

    <g transform="translate(0, 0)">
      <rect x="-200" y="0" width="1150" height="40" class="row-bg" />
      <text x="-190" y="20" class="name-label">Chease Raimondo</text>
      <rect x="460" y="5" width="61" height="30" class="role-Szenátor" rx="4" />
      <rect x="521" y="5" width="429" height="30" class="role-Diktátor" rx="4" />
    </g>

    <g transform="translate(0, 45)">
