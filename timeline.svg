<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="1400" height="800" font-family="Arial, sans-serif">
  <style>
    .grid-line { stroke: #e0e0e0; stroke-width: 1; }
    .year-label { font-size: 14px; fill: #666; text-anchor: middle; }
    .row-bg { fill: #f9f9f9; }
    .row-bg:nth-child(even) { fill: #ffffff; }
    .name-label { font-size: 15px; fill: #333; dominant-baseline: middle; font-weight: bold; }
    .legend-item { font-size: 13px; fill: #333; dominant-baseline: middle; }
    .title { font-size: 26px; font-weight: bold; fill: #333; text-anchor: middle; }
    
    /* Role Colors */
    .role-Diktátor { fill: #e74c3c; } /* Red */
    .role-Kancellár { fill: #9b59b6; } /* Purple */
    .role-Konzul { fill: #2ecc71; } /* Green */
    .role-Kormányzó { fill: #1abc9c; } /* Teal */
    .role-Nemzeti-Bank-elnök { fill: #f39c12; } /* Orange */
    .role-Szenátor { fill: #3498db; } /* Blue */
    .role-Titkosszolgálat-igazgató { fill: #34495e; } /* Dark Grey */
  </style>

  <rect width="100%" height="100%" fill="white" />

  <text x="700" y="40" class="title">Kormányzati Pozíciók (2005 - 2025)</text>

  <g transform="translate(180, 70)">
    <rect x="0" y="0" width="16" height="16" class="role-Szenátor" rx="3" />
    <text x="22" y="9" class="legend-item">Szenátor</text>
    
    <rect x="110" y="0" width="16" height="16" class="role-Diktátor" rx="3" />
