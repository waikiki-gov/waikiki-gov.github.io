    <rect x="440" y="0" width="16" height="16" class="role-Nemzeti-Bank-elnök" rx="3" />
    <text x="462" y="9" class="legend-item">Nemzeti Bank elnök</text>
    
    <rect x="620" y="0" width="16" height="16" class="role-Kormányzó" rx="3" />
