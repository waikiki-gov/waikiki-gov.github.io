      <rect x="0" y="5" width="521" height="30" class="role-Diktátor" rx="4" />
      <rect x="521" y="5" width="429" height="30" class="role-Kancellár" rx="4" />
    </g>

    <g transform="translate(0, 90)">
      <rect x="-200" y="0" width="1150" height="40" class="row-bg" />
      <text x="-190" y="20" class="name-label">Jessica Walker</text>
      <rect x="245" y="5" width="215" height="30" class="role-Nemzeti-Bank-elnök" rx="4" />
      <rect x="521" y="5" width="184" height="30" class="role-Konzul" rx="4" />
      <rect x="735" y="5" width="215" height="30" class="role-Nemzeti-Bank-elnök" rx="4" />
    </g>

    <g transform="translate(0, 135)">
      <rect x="-200" y="0" width="1150" height="40" class="row-bg" />
      <text x="-190" y="20" class="name-label">Selena Gomez</text>
      <rect x="460" y="5" width="61" height="30" class="role-Szenátor" rx="4" />
      <rect x="521" y="5" width="184" height="30" class="role-Konzul" rx="4" />
      <rect x="735" y="5" width="215" height="30" class="role-Szenátor" rx="4" />
    </g>

    <g transform="translate(0, 180)">
      <rect x="-200" y="0" width="1150" height="40" class="row-bg" />
      <text x="-190" y="20" class="name-label">Angelina Chease</text>
      <rect x="460" y="5" width="490" height="30" class="role-Szenátor" rx="4" />
    </g>

    <g transform="translate(0, 225)">
      <rect x="-200" y="0" width="1150" height="40" class="row-bg" />
      <text x="-190" y="20" class="name-label">Jennifer Chease</text>
      <rect x="460" y="5" width="490" height="30" class="role-Szenátor" rx="4" />
    </g>

    <g transform="translate(0, 270)">
      <rect x="-200" y="0" width="1150" height="40" class="row-bg" />
      <text x="-190" y="20" class="name-label">Bailey Pickett</text>
      <rect x="460" y="5" width="490" height="30" class="role-Szenátor" rx="4" />
    </g>

    <g transform="translate(0, 315)">
      <rect x="-200" y="0" width="1150" height="40" class="row-bg" />
      <text x="-190" y="20" class="name-label">Taylor Lautner</text>
      <rect x="460" y="5" width="490" height="30" class="role-Szenátor" rx="4" />
    </g>

    <g transform="translate(0, 360)">
      <rect x="-200" y="0" width="1150" height="40" class="row-bg" />
      <text x="-190" y="20" class="name-label">Tyler Posey</text>
      <rect x="460" y="5" width="490" height="30" class="role-Szenátor" rx="4" />
    </g>

    <g transform="translate(0, 405)">
      <rect x="-200" y="0" width="1150" height="40" class="row-bg" />
      <text x="-190" y="20" class="name-label">Gregg Sulkin</text>
      <rect x="521" y="5" width="429" height="30" class="role-Szenátor" rx="4" />
    </g>

    <g transform="translate(0, 450)">
      <rect x="-200" y="0" width="1150" height="40" class="row-bg" />
      <text x="-190" y="20" class="name-label">Olivia Holt</text>
      <rect x="521" y="5" width="429" height="30" class="role-Szenátor" rx="4" />
    </g>

    <g transform="translate(0, 495)">
      <rect x="-200" y="0" width="1150" height="40" class="row-bg" />
      <text x="-190" y="20" class="name-label">Zac Efron</text>
      <rect x="521" y="5" width="184" height="30" class="role-Szenátor" rx="4" />
    </g>

    <g transform="translate(0, 540)">
      <rect x="-200" y="0" width="1150" height="40" class="row-bg" />
      <text x="-190" y="20" class="name-label">Smith Edward</text>
      <rect x="398" y="5" width="306" height="30" class="role-Kormányzó" rx="4" />
      <rect x="735" y="5" width="215" height="30" class="role-Titkosszolgálat-igazgató" rx="4" />
    </g>

  </g>
</svg>